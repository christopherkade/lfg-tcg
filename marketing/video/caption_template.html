<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 340px;
    background: #09090b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bar {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 72px;
    border-top: 1px solid #232326;
  }
  .caption {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.25;
    color: #f5f5f4;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .caption em {
    font-style: normal;
    color: #34D399;
  }
</style>
</head>
<body>
  <div class="bar"><div class="caption" id="cap"></div></div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("cap").innerHTML = params.get("text") || "";
  </script>
</body>
</html>
